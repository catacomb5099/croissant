[project]
name = "playlist-curator"
version = "0.1.0"
description = "Pre-computes weekly suggested playlists from Discogs popularity and YouTube Music play counts"
requires-python = ">=3.12"
dependencies = [
    "ytmusicapi==1.12.2",
    "requests>=2.32,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
curate = "curator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curator"]

[tool.pytest.ini_options]
markers = [
    "live: hits real Discogs / YouTube Music, opt-in only",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
