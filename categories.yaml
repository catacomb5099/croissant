# One entry per suggested playlist. Every key except `title` is sent to the Discogs search
# as a filter (https://www.discogs.com/developers#page:database,header:database-search).
# `year` must be a "from-to" range; it is also used to reject wrong YouTube Music matches.

80s-indie-pop:
  title: 80s indie pop
  year: 1980-1989
  style: Indie Pop

# Faithful to the brief, but Discogs has no grime albums before 2003 (the genre emerged
# then), so this returns 0 albums today. Change `year` to 2000-2009 to get a playlist.
90s-grime:
  title: 90s grime
  year: 1990-1999
  style: Grime

# "Current" is not computed: widen or bump the range each January.
current-pop:
  title: Current pop
  year: 2024-2026
  genre: Pop
