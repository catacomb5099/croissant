# One entry per suggested playlist. Every key except `title` is sent to the Discogs search
# as a filter (https://www.discogs.com/developers#page:database,header:database-search).
# `year` must be a "from-to" range; it is also used to reject wrong YouTube Music matches.
#
# Grouped by era: the client shows one shelf per group, all-time first, then each decade. A range
# that stays inside one decade is that decade's shelf; a range that spans decades is "all-time".
# Discogs has no "metal", "R&B", "dance" or "UK rap" genre: those are its style tags, checked live
# against the API on 28-09-2026 (the top albums looked right). Discogs tags big pop albums with a
# dozen styles, so the niche lists (drum and bass, dancehall, deep house) lean mainstream at the
# top; tighten a category by swapping its style, not by adding a second one (the API takes one).

# --- All-time: "from-to" spans every decade. Bump the top year each January, like current-pop.

rock-hits:
  title: Rock hits
  year: 1950-2026
  genre: Rock

pop-hits:
  title: Pop hits
  year: 1950-2026
  genre: Pop

# Discogs has no "UK rap" tag and its country filter follows the pressing, not the artist, so
# grime inside the hip hop genre is the closest it gets (Dizzee, Stormzy, slowthai, Skepta).
uk-rap-hits:
  title: UK rap hits
  year: 1950-2026
  genre: Hip Hop
  style: Grime

house-hits:
  title: House hits
  year: 1950-2026
  style: House

deep-house-hits:
  title: Deep house hits
  year: 1950-2026
  style: Deep House

techno-hits:
  title: Techno hits
  year: 1950-2026
  style: Techno

drum-and-bass-hits:
  title: Drum and bass hits
  year: 1950-2026
  style: Drum n Bass

disco-hits:
  title: Disco hits
  year: 1950-2026
  style: Disco

gaming-hits:
  title: Gaming hits
  year: 1950-2026
  style: Video Game Music

# "EDM" is not a Discogs tag; Progressive House from 2008 on is Avicii, Guetta, deadmau5, Calvin Harris.
edm-hits:
  title: EDM hits
  year: 2008-2026
  style: Progressive House

electronic-hits:
  title: Electronic hits
  year: 1950-2026
  genre: Electronic

# --- Now. "Current" is not computed: widen or bump the range each January.

current-pop:
  title: Current pop
  year: 2024-2026
  genre: Pop

current-hip-hop:
  title: Current hip hop
  year: 2024-2026
  genre: Hip Hop

# Thin on Discogs: 2024-2026 gave 22 albums and 37 songs, three short of an edition, so this
# reaches back a year further (33 albums). Still expect "not enough songs" some weeks.
new-uk-rap:
  title: New UK rap
  year: 2023-2026
  genre: Hip Hop
  style: Grime

